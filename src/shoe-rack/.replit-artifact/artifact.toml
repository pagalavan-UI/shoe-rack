kind = "web"
previewPath = "/"
title = "Shoe Rack"
version = "1.0.0"
id = "artifacts/shoe-rack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18314

[services.development]
run = "pnpm --filter @workspace/shoe-rack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shoe-rack", "run", "build" ]
publicDir = "artifacts/shoe-rack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18314"
BASE_PATH = "/"
